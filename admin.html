<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNFY Admin</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}.w{max-width:1100px;margin:auto;padding:20px}.box{background:#fff;padding:15px;border:1px solid #ddd;border-radius:12px;margin:12px 0}.i{width:100%;padding:10px;margin:5px 0;box-sizing:border-box}.b{background:#000;color:#fff;border:0;padding:10px;border-radius:7px;cursor:pointer}.d{background:#b00020}.g{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>FNFY Admin</h1><div id="login" class="box"><input id="em" class="i" placeholder="Admin Gmail"><input id="pw" class="i" type="password" placeholder="Password"><button class="b" onclick="login()">Login</button></div><div id="panel" style="display:none"><button class="b" onclick="logout()">Logout</button><div class="g"><div class="box"><h2>Product Add/Edit</h2><input id="id" class="i" placeholder="Product ID for edit"><input id="n" class="i" placeholder="Name"><input id="c" class="i" placeholder="Category"><input id="p" class="i" type="number" placeholder="Price"><input id="d" class="i" type="number" placeholder="Discount %"><input id="co" class="i" placeholder="Colors comma separated"><input id="s" class="i" placeholder="Sizes comma separated"><input id="i1" class="i" placeholder="Image 1 URL"><input id="i2" class="i" placeholder="Image 2 URL"><input id="i3" class="i" placeholder="Image 3 URL"><input id="i4" class="i" placeholder="Image 4 URL"><textarea id="desc" class="i" placeholder="Description"></textarea><button class="b" onclick="save()">Save Product</button></div><div class="box"><h2>Products</h2><div id="plist"></div></div></div><div class="box"><h2>Orders</h2><div id="olist"></div></div><div class="box"><h2>Reviews</h2><div id="rlist"></div></div></div></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getDatabase,ref,onValue,set,update,remove}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";import{firebaseConfig,ADMIN_EMAIL}from"./firebase-config.js";const db=getDatabase(initializeApp(firebaseConfig)),auth=getAuth(),$=x=>document.getElementById(x);window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)}catch(e){alert(e.message)}};window.logout=()=>signOut(auth);onAuthStateChanged(auth,u=>{let ok=u&&u.email===ADMIN_EMAIL;$("login").style.display=ok?"none":"block";$("panel").style.display=ok?"block":"none";if(ok)load()});function load(){onValue(ref(db,"products"),s=>{$("plist").innerHTML=Object.entries(s.val()||{}).map(([id,p])=>`<div class="box"><b>${p.name}</b> — ৳${p.price} — ${p.discount||0}% <button class="b" onclick="edit('${id}')">Edit</button><button class="b d" onclick="delp('${id}')">Delete</button></div>`).join("")});onValue(ref(db,"orders"),s=>{$("olist").innerHTML=Object.entries(s.val()||{}).map(([id,o])=>`<div class="box"><b>${id}</b><br>${o.name} — ৳${o.total}<br>Status: <b>${o.status}</b><br><button class="b" onclick="st('${id}','Confirmed')">Confirm</button><button class="b" onclick="st('${id}','Delivered')">Delivered</button><button class="b d" onclick="st('${id}','Cancelled')">Cancel</button></div>`).join("")});onValue(ref(db,"reviews"),s=>{$("rlist").innerHTML=Object.entries(s.val()||{}).map(([id,r])=>`<div class="box"><b>${r.name}</b> ${"⭐".repeat(+r.rating)}<p>${r.text}</p><button class="b d" onclick="delr('${id}')">Delete</button></div>`).join("")})}window.save=async()=>{let id=$("id").value||"P-"+Date.now().toString(36).toUpperCase();await set(ref(db,"products/"+id),{name:$("n").value,category:$("c").value,price:+$("p").value,discount:+$("d").value,color:$("co").value,size:$("s").value,image1:$("i1").value,image2:$("i2").value,image3:$("i3").value,image4:$("i4").value,description:$("desc").value,createdAt:Date.now()});alert("Saved")};window.edit=id=>onValue(ref(db,"products/"+id),s=>{let p=s.val();$("id").value=id;$("n").value=p.name||"";$("c").value=p.category||"";$("p").value=p.price||0;$("d").value=p.discount||0;$("co").value=p.color||"";$("s").value=p.size||"";["i1","i2","i3","i4"].forEach((x,i)=>$(x).value=p["image"+(i+1)]||"");$("desc").value=p.description||""},{onlyOnce:true});window.delp=id=>confirm("Delete?")&&remove(ref(db,"products/"+id));window.st=async(id,status)=>{let now=Date.now();await update(ref(db,"orders/"+id),{status,updatedAt:now});onValue(ref(db,"orders/"+id),s=>{let o=s.val()||{};set(ref(db,"tracking/"+id),{orderId:id,status,name:o.name||"",total:+o.total||0,updatedAt:now,createdAt:o.createdAt||now})},{onlyOnce:true});alert(status)};window.delr=id=>confirm("Delete review?")&&remove(ref(db,"reviews/"+id));</script></body></html>
