<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FNFY Premium Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

:root {
  --bg-dark: #0f172a;
  --bg-card: rgba(30, 41, 59, 0.7);
  --border: rgba(255, 255, 255, 0.1);
  --text-dark: #e2e8f0;
  --accent: #6366f1;
  --success: #10b981;
  --danger: #ef4444;
  --electric-border-color: #dd8448;
  --electric-light-color: oklch(from var(--electric-border-color) l c h);
  --gradient-color: oklch(from var(--electric-border-color) 0.3 calc(c / 2) h / 0.4);
  --color-neutral-900: oklch(0.185 0 0);
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  overflow-x: hidden;
}

/* Header */
.head {
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(12px);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 55px; height: 45px; object-fit: contain; border-radius: 10px; }
.brand b { font-size: 24px; letter-spacing: 2px; font-weight: 700; }
.logout { background: var(--danger); border-radius: 12px; padding: 10px 18px; font-weight: 600; }

/* Cards & Form */
.wrap { max-width: 1200px; margin: auto; padding: 20px; }
.card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  transition: all 0.4s ease;
}
h2, h3 { margin-top: 0; font-weight: 600; }

input, select, textarea {
  width: 100%;
  padding: 14px 16px;
  margin: 8px 0 15px;
  border: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.2);
  color: #fff;
  border-radius: 12px;
  font-family: 'Poppins', sans-serif;
  transition: all 0.3s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
}

button {
  background: var(--accent);
  border: 0;
  padding: 12px 20px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}
button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
.danger { background: var(--danger); }
.green { background: var(--success); }
.hidden { display: none !important; }
.msg { padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.1); }

/* ===================== Electric Border Animation (Fixed) ===================== */
.electric-main-container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}
.electric-svg-container { position: absolute; width: 0; height: 0; }

.electric-card-container {
  padding: 2px;
  border-radius: 20px;
  position: relative;
  width: 100%;
  max-width: 380px;
  overflow: hidden; /* বর্ডার বাইরে বের হওয়া বন্ধ */
  background: linear-gradient(-30deg, var(--gradient-color), transparent, var(--gradient-color)),
              linear-gradient(to bottom, var(--color-neutral-900), var(--color-neutral-900));
}

.electric-inner-container { position: relative; }

.electric-border-outer {
  border: 2px solid rgba(221, 132, 72, 0.5);
  border-radius: 20px;
  padding-right: 4px;
  padding-bottom: 4px;
}

.electric-main-card {
  width: 100%;
  height: 400px;
  border-radius: 20px;
  border: 2px solid var(--electric-border-color);
  margin-top: -4px;
  margin-left: -4px;
  filter: url(#turbulent-displace);
}

/* গ্লো লেয়ারগুলো কার্ডের ভেতরে আটকে রাখা */
.electric-glow-layer-1 {
  border: 2px solid rgba(221, 132, 72, 0.6);
  border-radius: 20px;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  filter: blur(1px);
}

.electric-glow-layer-2 {
  border: 2px solid var(--electric-light-color);
  border-radius: 20px;
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  filter: blur(4px);
}

.electric-overlay-1 {
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 20px;
  opacity: 1;
  mix-blend-mode: overlay;
  transform: scale(1.0); /* বাইরে বের হওয়া ঠেকাতে */
  filter: blur(16px);
  background: linear-gradient(-30deg, white, transparent 30%, transparent 70%, white);
}

.electric-overlay-2 {
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 20px;
  opacity: 0.5;
  mix-blend-mode: overlay;
  transform: scale(1.0);
  filter: blur(16px);
  background: linear-gradient(-30deg, white, transparent 30%, transparent 70%, white);
}

.electric-background-glow {
  position: absolute;
  width: 100%; height: 100%;
  top: 0; left: 0; right: 0; bottom: 0;
  border-radius: 20px;
  filter: blur(32px);
  transform: scale(1.0);
  opacity: 0.3;
  z-index: -1;
  background: linear-gradient(-30deg, var(--electric-light-color), transparent, var(--electric-border-color));
}

/* ফর্মের কনটেইনার */
.electric-content-container {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.electric-title {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 25px;
  text-shadow: 0 0 10px var(--electric-border-color);
  letter-spacing: 2px;
}

.electric-divider {
  width: 60%;
  border: none;
  height: 1px;
  background-color: #fff;
  opacity: 0.2;
  margin-bottom: 25px;
}

/* Login form সঠিকভাবে সাজানো */
.electric-login-form {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 260px;
  gap: 12px;
}

.electric-login-form input {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #fff;
  padding: 13px 15px;
  border-radius: 10px;
  font-size: 15px;
  text-align: center;
  margin: 0 !important; /* বাড়তি margin বাদ */
}

.electric-login-form input::placeholder { color: rgba(255, 255, 255, 0.7); }

.electric-login-form button {
  background: var(--electric-border-color);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1px;
  box-shadow: 0 0 15px rgba(221, 132, 72, 0.5);
}

.electric-login-form button:hover {
  background: #ff9a5c;
}

/* ===================== End Electric Border ===================== */

/* Shipping Car */
.shipping-card { margin-top: 20px; }
.shipping-road {
  width: 100%;
  height: 80px;
  background: linear-gradient(to bottom, #1e293b, #0f172a);
  border-radius: 15px;
  position: relative;
  overflow: hidden;
  margin-bottom: 15px;
  border: 1px solid rgba(255,255,255,0.1);
}
.shipping-road::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  height: 2px;
  background: repeating-linear-gradient(90deg, #facc15 0px, #facc15 20px, transparent 20px, transparent 40px);
  animation: roadmove 1s linear infinite;
}
@keyframes roadmove { from { background-position-x: 0; } to { background-position-x: -40px; } }
.car-anim {
  position: absolute;
  bottom: 15px;
  width: 100px;
  animation: drive 6s linear infinite;
}
@keyframes drive { from { left: 100%; } to { left: -120px; } }
.car-body { fill: #ef4444; }
.car-window { fill: #fff; opacity: 0.8; }
.car-wheel { fill: #111; }

/* Premium Order Button */
.order-btn-premium {
  position: relative;
  width: 100%;
  padding: 12px;
  border-radius: 50px;
  background: var(--accent);
  color: #fff;
  overflow: hidden;
  border: none;
  cursor: pointer;
  margin-bottom: 10px;
}
.order-btn-premium span {
  position: absolute;
  width: 100%;
  left: 0;
  top: 0;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
.order-btn-premium span.default { transform: translateY(0); }
.order-btn-premium span.success { transform: translateY(100%); opacity: 0; }
.order-btn-premium.active { background: var(--success); }
.order-btn-premium.active span.default { transform: translateY(-100%); opacity: 0; }
.order-btn-premium.active span.success { transform: translateY(0); opacity: 1; transition-delay: 0.2s; }

/* Table */
.table { overflow-x: auto; }
th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
</style>
</head>
<body>

<div class="head">
  <div class="brand"><img src="./assets/fnfy-logo.png" onerror="this.onerror=null;this.src='./fnfy-logo.png'"><div><b>FNFY</b><br><small>PREMIUM ADMIN</small></div></div>
  <button id="logout" class="logout hidden">Logout</button>
</div>

<div class="wrap">

  <!-- Electric Border Login Form -->
  <div class="electric-main-container" id="login">
    <!-- SVG Filters for Electric Border -->
    <svg class="electric-svg-container">
      <defs>
        <filter id="turbulent-displace" colorInterpolationFilters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise1" seed="1" />
          <feOffset in="noise1" dx="0" dy="0" result="offsetNoise1">
            <animate attributeName="dy" values="700; 0" dur="6s" repeatCount="indefinite" calcMode="linear" />
          </feOffset>
          <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise2" seed="1" />
          <feOffset in="noise2" dx="0" dy="0" result="offsetNoise2">
            <animate attributeName="dy" values="0; -700" dur="6s" repeatCount="indefinite" calcMode="linear" />
          </feOffset>
          <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise1" seed="2" />
          <feOffset in="noise1" dx="0" dy="0" result="offsetNoise3">
            <animate attributeName="dx" values="490; 0" dur="6s" repeatCount="indefinite" calcMode="linear" />
          </feOffset>
          <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise2" seed="2" />
          <feOffset in="noise2" dx="0" dy="0" result="offsetNoise4">
            <animate attributeName="dx" values="0; -490" dur="6s" repeatCount="indefinite" calcMode="linear" />
          </feOffset>
          <feComposite in="offsetNoise1" in2="offsetNoise2" result="part1" />
          <feComposite in="offsetNoise3" in2="offsetNoise4" result="part2" />
          <feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise" />
          <feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="30" xChannelSelector="R" yChannelSelector="B" />
        </filter>
      </defs>
    </svg>

    <!-- Electric Border Card -->
    <div class="electric-card-container">
      <div class="electric-inner-container">
        <div class="electric-border-outer">
          <div class="electric-main-card"></div>
        </div>
        <div class="electric-glow-layer-1"></div>
        <div class="electric-glow-layer-2"></div>
      </div>
      <div class="electric-overlay-1"></div>
      <div class="electric-overlay-2"></div>
      <div class="electric-background-glow"></div>

      <!-- Form Content inside the electric border -->
      <div class="electric-content-container">
        <h2 class="electric-title">Admin Login</h2>
        <div class="electric-login-form">
          <input id="email" type="email" placeholder="Admin Gmail">
          <input id="pass" type="password" placeholder="Password">
          <button id="loginBtn">Login</button>
        </div>
        <p id="msg" style="color:#ffcccc;font-size:14px;margin-top:10px"></p>
      </div>
    </div>
  </div>

  <!-- Admin Panel (Hidden initially) -->
  <div id="panel" class="hidden">
    
    <div class="card">
      <h2>➕ Add Premium Product</h2>
      <form id="pf">
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
          <input id="pn" placeholder="Product name" required>
          <input id="pc" placeholder="Category" required>
        </div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
          <input id="pp" type="number" min="0" placeholder="Price" required>
          <input id="pdiscount" type="number" min="0" max="100" placeholder="Discount % (optional)">
        </div>
        <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
          <input id="pcol" placeholder="Colors: Black, Blue">
          <input id="psz" placeholder="Sizes: 28, 30, 32, 34">
        </div>
        <textarea id="pd" placeholder="Description"></textarea>
        <input id="imgs" type="file" accept="image/*" multiple required>
        <div class="preview" id="preview"></div>
        <p id="up" class="msg">Storage লাগবে না — image compressed হয়ে Realtime Database-এ save হবে.</p>
        <button id="add" type="submit" style="width:100%">Add Product</button>
      </form>
    </div>

    <div class="card shipping-card">
      <h2>📦 Orders</h2>
      <div class="shipping-road">
        <div class="car-anim">
          <svg viewBox="0 0 100 40">
            <path class="car-body" d="M5,20 L15,15 L25,10 L65,10 L80,15 L95,20 L95,30 L5,30 Z"></path>
            <rect class="car-window" x="25" y="12" width="35" height="8" rx="2"></rect>
            <circle class="car-wheel" cx="20" cy="30" r="5"></circle>
            <circle class="car-wheel" cx="80" cy="30" r="5"></circle>
            <rect x="5" y="20" width="5" height="3" fill="#fef08a"></rect>
            <rect x="90" y="20" width="5" height="3" fill="#ef4444"></rect>
          </svg>
        </div>
      </div>
      <div id="orderMsg" class="msg"></div>
      <div class="table">
        <table>
          <thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="orders"><tr><td colspan="8">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>🛍 Products</h2>
      <div id="products">Loading...</div>
    </div>

  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,push,set,onValue,remove,update,get}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import{firebaseConfig,ADMIN_EMAIL}from"./firebase-config.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);

onAuthStateChanged(auth,u=>{
 if(u&&u.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
  $("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");loadProducts();loadOrders();
 }else if(u){$("msg").textContent="এই Gmail admin নয়";signOut(auth)}
});
$("loginBtn").onclick=async()=>{
 try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}
 catch(e){$("msg").textContent=e.code+" — "+e.message}
};
$("logout").onclick=()=>signOut(auth);

function loadProducts(){
 onValue(ref(db,"products"),s=>{
  const d=s.val()||{};
  $("products").innerHTML=Object.entries(d).map(([id,p])=>`<div class="product"><img src="${esc(p.image||"./assets/fnfy-logo.png")}"><div style="flex:1"><b>${esc(p.name)}</b><br>${esc(p.category||"")} · ৳${Number(p.price||0).toLocaleString()}</div><button class="danger" data-del="${esc(id)}">Delete</button></div>`).join("")||"No products";
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete product?"))await remove(ref(db,"products/"+b.dataset.del))});
 },e=>$("products").textContent="Error: "+e.message);
}

/* প্রিমিয়াম অর্ডার কনফার্ম বাটন */
function animateOrderButton(btn) {
  btn.classList.add('active');
  setTimeout(() => { btn.classList.remove('active'); }, 1500);
}

function loadOrders(){
 onValue(ref(db,"orders"),async s=>{
  const d=s.val()||{};
  const arr=Object.entries(d).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
  let trackingData={};
  try{const tSnap=await get(ref(db,"tracking"));trackingData=tSnap.val()||{};}catch(e){}
  for(const [id,o] of arr){ if(!trackingData[id]){ trackingData[id]={orderId:o.orderId||id,status:o.status||"Pending",updatedAt:o.updatedAt||o.createdAt||Date.now()}; await set(ref(db,"tracking/"+id),trackingData[id]).catch(()=>{});} }
  
  $("orders").innerHTML=arr.map(([id,o])=>{
   const items=(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}<br><small>Size: ${esc(x.size)} | Color: ${esc(x.color)}</small>`).join("<hr>");
   const status=o.status||"Pending";
   return `<tr><td><b>${esc(o.orderId||id)}</b></td><td><b>${esc(o.name)}</b><br>${esc(o.phone)}<br>${esc(o.address)}</td><td>${items}</td><td><b>৳${Number(o.total||0).toLocaleString()}</b></td><td><b>${esc(o.paymentMethod||"—")}</b></td><td>${o.createdAt?new Date(o.createdAt).toLocaleString():"—"}</td><td><select data-status="${esc(id)}">${["Pending","Confirmed","Delivered","Cancelled"].map(x=>`<option ${x===status?"selected":""}>${x}</option>`).join("")}</select></td>
   <td><button class="order-btn-premium" data-action="${esc(id)}" data-next="Confirmed"><span class="default">Confirm</span><span class="success">✓ Done</span></button><br><button class="green" data-action="${esc(id)}" data-next="Delivered">Delivered</button><br><button class="danger" data-action="${esc(id)}" data-next="Cancelled">Cancel</button><br><button class="danger" data-order-del="${esc(id)}">Delete</button></td></tr>`;
  }).join("")||'<tr><td colspan="8">No orders yet</td></tr>';

  document.querySelectorAll("[data-status]").forEach(x=>x.onchange=()=>syncOrderStatus(x.dataset.status,x.value));
  document.querySelectorAll(".order-btn-premium[data-action]").forEach(b=>b.onclick=()=>{
    animateOrderButton(b);
    syncOrderStatus(b.dataset.action, b.dataset.next);
  });
  document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>syncOrderStatus(b.dataset.action,b.dataset.next));
  document.querySelectorAll("[data-order-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete order?")){await remove(ref(db,"orders/"+b.dataset.orderDel));await remove(ref(db,"tracking/"+b.dataset.orderDel));}});
 },e=>$('orders').innerHTML=`<tr><td colspan="8">Error: ${esc(e.message)}</td></tr>`);
}

async function syncOrderStatus(orderId,status){
 try{
  const now=Date.now();
  await update(ref(db,"orders/"+orderId),{status,updatedAt:now,orderId});
  await update(ref(db,"tracking/"+orderId),{orderId,status,updatedAt:now,updatedBy:ADMIN_EMAIL});
  $("orderMsg").textContent=`Order ${orderId} → ${status} saved successfully.`;
 }catch(e){$("orderMsg").textContent="Status update failed: "+e.message}
}

function resizeImage(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>{
   const img=new Image();img.onload=()=>{
    const maxWidth=800,scale=Math.min(1,maxWidth/img.width),c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.58));
   };img.onerror=reject;img.src=r.result;
  };r.onerror=reject;r.readAsDataURL(file);
 });
}
$("imgs").onchange=async()=>{
 $("preview").innerHTML="";
 for(const f of [...$("imgs").files].slice(0,4)){const src=await resizeImage(f);const im=document.createElement("img");im.src=src;$("preview").appendChild(im)}
};
$("pf").onsubmit=async e=>{
 e.preventDefault();$("add").disabled=true;
 try{
  const fs=[...$("imgs").files].slice(0,4);if(!fs.length)throw Error("Image নির্বাচন করুন");
  const images=[];for(let i=0;i<fs.length;i++){$("up").textContent=`Image ${i+1}/${fs.length} prepare হচ্ছে...`;images.push(await resizeImage(fs[i]))}
  await set(push(ref(db,"products")),{name:$("pn").value.trim(),category:$("pc").value.trim(),price:Number($("pp").value),discountPercent:Math.max(0,Math.min(100,Number($("pdiscount").value||0))),colors:$("pcol").value.split(",").map(x=>x.trim()).filter(Boolean),sizes:$("psz").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("pd").value.trim(),image:images[0],images,createdAt:Date.now()});
  e.target.reset();$("preview").innerHTML="";$("up").textContent="Product Firebase-এ save হয়েছে!";
 }catch(e){$("up").textContent="Product save হয়নি: "+e.message}
 finally{$("add").disabled=false}
};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
</script>
</body>
</html>
