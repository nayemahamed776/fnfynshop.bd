<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNFY Admin</title><link rel="icon" href="fnfy-logo.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f4f4;color:#111}.wrap{max-width:1200px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-bottom:16px}.top{background:#111;color:#fff;border-radius:16px;padding:10px 15px;display:flex;align-items:center;gap:12px}.logo{height:48px;background:#fff;border-radius:8px}.sp{flex:1}.btn{border:0;background:#111;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}.white{background:#fff;color:#111}.danger{background:#b00020}.ok{background:#176b32}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px}.stat b{font-size:27px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}textarea{min-height:85px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0}.tabs button{padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}.hidden{display:none}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.pics{display:flex;gap:5px}.pics img{width:55px;height:55px;object-fit:cover;border-radius:7px}.login{max-width:420px;margin:70px auto}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><div class="wrap">
<div id="login" class="box login"><img class="logo" src="fnfy-logo.png"><h2>FNFY Admin Login</h2><input id="email" type="email" placeholder="Admin email"><br><br><input id="password" type="password" placeholder="Password"><br><br><button class="btn" onclick="login()">Login</button><p id="msg"></p></div>
<div id="app" class="hidden"><div class="top"><img class="logo" src="fnfy-logo.png"><b>FNFY Admin</b><span class="sp"></span><button class="btn white" onclick="logout()">Logout</button></div>
<div class="grid" style="margin:15px 0"><div class="stat">Products<br><b id="np">0</b></div><div class="stat">Orders<br><b id="no">0</b></div><div class="stat">Pending<br><b id="npen">0</b></div><div class="stat">Delivered<br><b id="ndel">0</b></div></div>
<div class="tabs"><button onclick="tab('products')">Products</button><button onclick="tab('orders')">Orders</button><button onclick="tab('categories')">Categories</button><button onclick="tab('reviews')">Reviews</button><button onclick="tab('settings')">Settings</button></div>
<section id="products" class="box"><h2>Add / Edit Product</h2><form id="pf" class="form"><input id="pid" type="hidden"><input id="name" required placeholder="Product name"><input id="category" required placeholder="Category"><input id="price" type="number" required placeholder="Regular price"><input id="discount" type="number" min="0" max="100" placeholder="Discount %"><input id="color" placeholder="Colors, comma separated"><input id="size" placeholder="Sizes, comma separated"><textarea id="desc" class="full" placeholder="Description"></textarea><div class="full"><b>Gallery: select up to 4 images</b><input id="files" type="file" accept="image/*" multiple></div><div id="oldpics" class="full"></div><div class="full"><button class="btn ok">Save Product</button><button type="button" class="btn" onclick="clearForm()">Clear</button></div></form><hr><h2>Products</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Product</th><th>Price</th><th>Discount</th><th>Images</th><th>Actions</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section id="orders" class="box hidden"><h2>Orders</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div></section>
<section id="categories" class="box hidden"><h2>Categories</h2><form id="cf"><input id="newcat" placeholder="Category name" required><button class="btn">Add</button></form><div id="catRows"></div></section>
<section id="reviews" class="box hidden"><h2>Reviews</h2><div id="reviewRows"></div></section>
<section id="settings" class="box hidden"><h2>Website Settings</h2><form id="sf" class="form"><input id="shopname" placeholder="Shop name"><input id="wa" placeholder="WhatsApp"><input id="fb" class="full" placeholder="Facebook URL"><input id="dhaka" type="number" placeholder="Dhaka delivery"><input id="outside" type="number" placeholder="Outside delivery"><div class="full"><button class="btn">Save Settings</button></div></form><p>Video option is OFF in this final project.</p></section>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,onValue,set,update,remove}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{firebaseConfig,ADMIN_EMAIL}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);let products={},orders={},editing=null,old=[];
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}catch(e){$("msg").textContent=e.message}};window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u?.email===ADMIN_EMAIL){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}else if(u)signOut(auth)});
function tab(id){document.querySelectorAll("#app section").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden")}window.tab=tab;
function load(){onValue(ref(db,"products"),s=>{products=s.val()||{};renderProducts();stats()});onValue(ref(db,"orders"),s=>{orders=s.val()||{};renderOrders();stats()});onValue(ref(db,"categories"),s=>renderCats(s.val()||{}));onValue(ref(db,"reviews"),s=>renderReviews(s.val()||{}));onValue(ref(db,"settings"),s=>{let x=s.val()||{};$("shopname").value=x.shopName||"FNFY";$("wa").value=x.whatsapp||"01965460567";$("fb").value=x.facebook||"https://www.facebook.com/share/19RWoj5v3K/";$("dhaka").value=x.dhakaDelivery??60;$("outside").value=x.outsideDelivery??120})}
function stats(){let a=Object.values(orders);$("np").textContent=Object.keys(products).length;$("no").textContent=a.length;$("npen").textContent=a.filter(x=>x.status==="Pending").length;$("ndel").textContent=a.filter(x=>x.status==="Delivered").length}
function renderProducts(){$("productRows").innerHTML=Object.entries(products).map(([id,p])=>`<tr><td><b>${esc(p.name)}</b><br>${esc(p.category)}</td><td>৳${p.price}</td><td>${p.discount||0}%</td><td><div class="pics">${(p.images||[]).map(x=>`<img src="${x}">`).join("")}</div></td><td><button class="btn" onclick="edit('${id}')">Edit</button> <button class="btn danger" onclick="del('${id}')">Delete</button></td></tr>`).join("")}
window.edit=id=>{let p=products[id];editing=id;old=p.images||[];$("pid").value=id;$("name").value=p.name||"";$("category").value=p.category||"";$("price").value=p.price||"";$("discount").value=p.discount||0;$("color").value=p.color||"";$("size").value=p.size||"";$("desc").value=p.description||"";$("oldpics").innerHTML=old.map(x=>`<img src="${x}" style="width:70px;height:70px;object-fit:cover;margin:4px;border-radius:8px">`).join("");scrollTo(0,0)};
window.del=id=>confirm("Delete product?")&&remove(ref(db,"products/"+id));
function clearForm(){editing=null;old=[];$("pf").reset();$("oldpics").innerHTML=""}window.clearForm=clearForm;
function compress(file){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement("canvas"),m=1100/Math.max(im.width,im.height),s=Math.min(1,m);c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(file)})}
$("pf").onsubmit=async e=>{e.preventDefault();try{let fs=[...$("files").files].slice(0,4),images=fs.length?await Promise.all(fs.map(compress)):old;if(!images.length)return alert("Select at least one image.");let data={name:$("name").value.trim(),category:$("category").value.trim(),price:Number($("price").value),discount:Math.max(0,Math.min(100,Number($("discount").value||0))),color:$("color").value.trim(),size:$("size").value.trim(),description:$("desc").value.trim(),images,updatedAt:Date.now()};let id=editing||crypto.randomUUID();if(!editing)data.createdAt=Date.now();await set(ref(db,"products/"+id),data);alert(editing?"Updated":"Added");clearForm()}catch(e){alert(e.message)}};
function renderOrders(){let a=Object.entries(orders).sort((x,y)=>(y[1].createdAt||0)-(x[1].createdAt||0));$("orderRows").innerHTML=a.map(([id,o])=>`<tr><td><b>${esc(id)}</b></td><td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</td><td>${(o.items||[]).map(i=>esc(i.name)+" × "+i.qty).join("<br>")}</td><td>৳${o.total}</td><td><select onchange="status('${id}',this.value)">${["Pending","Confirmed","Delivered","Cancelled"].map(x=>`<option ${x===o.status?"selected":""}>${x}</option>`).join("")}</select></td></tr>`).join("")}
window.status=async(id,s)=>{await update(ref(db,"orders/"+id),{status:s,updatedAt:Date.now()});await update(ref(db,"tracking/"+id),{status:s,updatedAt:Date.now()})};
function renderCats(c){$("catRows").innerHTML=Object.entries(c).map(([id,x])=>`<p>${esc(x)} <button class="btn danger" onclick="removeCat('${id}')">Delete</button></p>`).join("")}window.removeCat=id=>remove(ref(db,"categories/"+id));
$("cf").onsubmit=async e=>{e.preventDefault();await set(ref(db,"categories/"+crypto.randomUUID()),$("newcat").value.trim());$("newcat").value=""};
function renderReviews(r){$("reviewRows").innerHTML=Object.entries(r).map(([id,x])=>`<div class="box"><b>${esc(x.name)}</b><p>${esc(x.text)}</p><button class="btn danger" onclick="removeReview('${id}')">Delete</button></div>`).join("")}window.removeReview=id=>remove(ref(db,"reviews/"+id));
$("sf").onsubmit=async e=>{e.preventDefault();await set(ref(db,"settings"),{shopName:$("shopname").value,whatsapp:$("wa").value,facebook:$("fb").value,dhakaDelivery:Number($("dhaka").value),outsideDelivery:Number($("outside").value)});alert("Settings saved")};
</script></body></html>
