<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNFY Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;font-family:Arial}.head{background:#080808;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:8px}.brand img{width:55px;height:45px;object-fit:contain}.wrap{max-width:1100px;margin:auto;padding:15px}.card{background:#fff;padding:18px;border-radius:15px;margin:15px 0}input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;border:1px solid #ccc;border-radius:9px;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{background:#111;color:#fff;border:0;border-radius:9px;padding:11px 14px;font-weight:bold;cursor:pointer}.danger{background:#a00000}.green{background:#12833b}.hidden{display:none!important}.msg{padding:10px;background:#eee;border-radius:8px;white-space:pre-wrap}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top;font-size:13px}.product{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.product img{width:65px;height:65px;object-fit:cover;border-radius:8px}.preview{display:flex;gap:7px;flex-wrap:wrap}.preview img{width:70px;height:70px;object-fit:cover;border-radius:8px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body>
<div class="head"><div class="brand"><img src="assets/fnfy-logo.png"><b>FNFY ADMIN</b></div><button id="logout" class="hidden">Logout</button></div><div class="wrap">
<div id="login" class="card" style="max-width:430px;margin:40px auto"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin Gmail"><input id="pass" type="password" placeholder="Password"><button id="lb">Login</button><p id="lm" class="msg"></p></div>
<div id="panel" class="hidden">
<div class="card"><h2>Add Product</h2><form id="pf"><div class="row"><input id="pn" placeholder="Product name" required><input id="pc" placeholder="Category" required></div><div class="row"><input id="pp" type="number" placeholder="Price" required><input id="pco" placeholder="Colors: Black, Blue"></div><input id="psz" placeholder="Sizes: 28,30,32,34"><textarea id="pd" placeholder="Description"></textarea><input id="im" type="file" accept="image/*" multiple required><div id="pr" class="preview"></div><label><b>Product Video URL</b></label><input id="vu" placeholder="YouTube embed URL (optional)"><p class="msg">Firebase Storage চালু না থাকায় এখানে video URL রাখা হচ্ছে। YouTube embed URL দিলে product page-এ video দেখাবে।</p><button id="ab">Add Product</button></form></div>
<div class="card"><h2>Orders</h2><p id="om" class="msg"></p><div class="table"><table><thead><tr><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></div>
<div class="card"><h2>Products</h2><div id="products"></div></div>
</div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getDatabase,ref,push,set,onValue,remove,update}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";import{firebaseConfig,ADMIN_EMAIL}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
onAuthStateChanged(auth,u=>{if(u&&u.email?.toLowerCase()===ADMIN_EMAIL){$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");products();orders()}else if(u){$("lm").textContent="এই Gmail admin নয়";signOut(auth)}});
$("lb").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("lm").textContent=e.code+" — "+e.message}};$("logout").onclick=()=>signOut(auth);
function products(){onValue(ref(db,"products"),s=>{let d=s.val()||{};$("products").innerHTML=Object.entries(d).map(([id,p])=>`<div class="product"><img src="${esc(p.image||"assets/fnfy-logo.png")}"><div style="flex:1"><b>${esc(p.name)}</b><br>৳${p.price}</div><button class="danger" data-d="${id}">Delete</button></div>`).join("")||"No products";document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete?"))await remove(ref(db,"products/"+b.dataset.d))})})}
function orders(){onValue(ref(db,"orders"),s=>{let d=s.val()||{},a=Object.entries(d).sort((x,y)=>(y[1].createdAt||0)-(x[1].createdAt||0));$("orders").innerHTML=a.map(([id,o])=>`<tr><td><b>${esc(o.name)}</b><br>${esc(o.phone)}<br>${esc(o.address)}<br><small>ID: ${esc(id)}</small></td><td>${(o.items||[]).map(x=>`${esc(x.name)} × ${x.qty}<br>Size ${esc(x.size)} / ${esc(x.color)}`).join("<hr>")}</td><td>Subtotal ৳${o.subtotal}<br>Delivery ৳${o.deliveryCharge}<br><b>Total ৳${o.total}</b></td><td><select data-s="${id}">${["Pending","Confirmed","Delivered","Cancelled"].map(x=>`<option ${x===(o.status||"Pending")?"selected":""}>${x}</option>`).join("")}</select></td><td><button class="green" data-c="${id}">Confirm</button> <button class="danger" data-x="${id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="5">No orders</td></tr>';document.querySelectorAll("[data-s]").forEach(x=>x.onchange=()=>update(ref(db,"orders/"+x.dataset.s),{status:x.value}));document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>update(ref(db,"orders/"+b.dataset.c),{status:"Confirmed"}));document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(confirm("Delete order?"))await remove(ref(db,"orders/"+b.dataset.x))})})}
function resize(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let m=500,s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.58))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
$("im").onchange=async()=>{$("pr").innerHTML="";for(let f of [...$("im").files].slice(0,4)){let x=await resize(f),i=document.createElement("img");i.src=x;$("pr").appendChild(i)}};
$("pf").onsubmit=async e=>{e.preventDefault();$("ab").disabled=true;try{let fs=[...$("im").files].slice(0,4),imgs=[];for(let f of fs)imgs.push(await resize(f));await set(push(ref(db,"products")),{name:$("pn").value.trim(),category:$("pc").value.trim(),price:Number($("pp").value),colors:$("pco").value.split(",").map(x=>x.trim()).filter(Boolean),sizes:$("psz").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("pd").value.trim(),image:imgs[0],images:imgs,videoUrl:$("vu").value.trim(),createdAt:Date.now()});e.target.reset();$("pr").innerHTML="";alert("Product added")}catch(e){alert("Product save হয়নি: "+e.message)}finally{$("ab").disabled=false}};
</script>
<script>
function editProduct(id,p){
  const name=prompt("Product name:",p.name||""); if(name===null)return;
  const price=prompt("Price:",p.price||""); if(price===null)return;
  const category=prompt("Category:",p.category||p.cat||""); if(category===null)return;
  const description=prompt("Description:",p.description||p.desc||""); if(description===null)return;
  update(ref(db,"products/"+id),{...p,name,price:Number(price),category,description})
    .then(()=>alert("Product updated successfully"))
    .catch(e=>alert("Update failed: "+e.message));
}
</script>
</body></html>
