.foot img{width:105px;background:#fff;border-radius:8px}.foot a{color:#fff;margin-right:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.dots{display:block}.desktop{display:none}.detail{grid-template-columns:1fr}.hero{height:270px}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.card img{height:200px}.nav a,.btn{padding:8px;font-size:12px}}
</style></head><body><header><nav class="nav"><img class="logo" src="fnfy-logo.svg"><a class="desktop" href="#categories">Categories</a><a href="#cart">Cart <span id="cc">0</span></a><a class="desktop" href="https://wa.me/8801965460567" target="_blank">WhatsApp</a><a class="desktop" href="https://www.facebook.com/share/19RWoj5v3K/" target="_blank">Facebook</a><a class="desktop" href="https://www.instagram.com/fnfy2026/" target="_blank">Instagram</a><button class="dots" onclick="toggleCats()">⋮</button></nav><div id="mobileCats" class="wrap" style="display:none;padding-bottom:10px"></div></header>
<main><div class="hero"><img id="hero"><b id="heroText">FNFY Men's Clothing</b></div><div class="wrap"><section class="section" id="categories"><h2>Categories</h2><div id="cats" class="filters"></div></section><section class="section"><h2>New Arrivals</h2><div id="new" class="grid"></div></section><section class="section"><h2>Discount / Offers</h2><div id="offers" class="grid"></div></section><section class="section"><h2>Products</h2><div id="products" class="grid"></div></section><section class="section" id="cart"><h2>Cart</h2><div id="cartBox" class="box">Empty</div></section><section class="section"><h2>Order Tracking</h2><div class="box"><input id="tid" class="input" placeholder="Order ID"><button class="btn" onclick="track()">Track</button><div id="tr"></div></div></section><section class="section"><h2>Customer Reviews</h2><form id="rf" class="box"><div class="row"><input id="rn" class="input" required placeholder="Name"><select id="rr" class="input" required><option value="">Rating</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div><textarea id="rt" class="input" required placeholder="Review"></textarea><button class="btn">Submit Review</button></form><div id="reviews"></div></section></div></main>
<footer><div class="foot"><img src="fnfy-logo.svg"><div><b>FNFY Men's Clothing</b><p>Shirt • Pant • Men's Fashion</p><a href="https://www.facebook.com/share/19RWoj5v3K/" target="_blank">Facebook</a><a href="https://wa.me/8801965460567" target="_blank">WhatsApp</a><a href="https://www.instagram.com/fnfy2026/" target="_blank">Instagram</a><p>Contact: 01965460567</p></div></div></footer>
<div id="pm" class="modal"><div><button class="btn" onclick="closeP()">Close</button><div id="detail"></div></div></div><div id="om" class="modal"><div><button class="btn" onclick="closeO()">Close</button><h2>Website Order</h2><form id="of"><input id="on" class="input" required placeholder="Name"><input id="op" class="input" required placeholder="Phone"><textarea id="oa" class="input" required placeholder="Address"></textarea><button class="btn">Place Order</button></form></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";import{firebaseConfig}from"./firebase-config.js";const db=getDatabase(initializeApp(firebaseConfig)),W="8801965460567";let P={},cat="All",C=[],did="",sz="",co="",qty=1;
const $=x=>document.getElementById(x),e=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),ims=p=>[p.image1,p.image2,p.image3,p.image4].filter(Boolean),pr=p=>Math.round(+p.price*(1-+p.discount/100));
function card(id){let p=P[id],i=ims(p)[0]||"";return`<div class="card"><img src="${i}"><div class="p"><b>${e(p.name)}</b><p>৳${pr(p).toLocaleString()} ${+p.discount?`<span class="old">৳${+p.price}</span> <b>${p.discount}% OFF</b>`:""}</p><button class="btn" onclick="openP('${id}')">Buy Now</button> <button class="btn" onclick="openP('${id}')">Add to Cart</button></div></div>`}
function render(){let a=Object.entries(P).filter(x=>cat=="All"||x[1].category==cat);$("products").innerHTML=a.map(x=>card(x[0])).join("");$("new").innerHTML=a.slice().sort((x,y)=>(y[1].createdAt||0)-(x[1].createdAt||0)).slice(0,4).map(x=>card(x[0])).join("");$("offers").innerHTML=a.filter(x=>+x[1].discount>0).slice(0,4).map(x=>card(x[0])).join("");cartRender()}
function cats(){let c=[...new Set(["All",...Object.values(P).map(x=>x.category).filter(Boolean)])],h=c.map(x=>`<button class="${x==cat?"on":""}" onclick="setCat(${JSON.stringify(x)})">${e(x)}</button>`).join("");$("cats").innerHTML=h;$("mobileCats").innerHTML=h}
window.setCat=x=>{cat=x;cats();render()};window.toggleCats=()=>{$("mobileCats").style.display=$("mobileCats").style.display=="none"?"block":"none"};
window.openP=id=>{did=id;sz="";co="";qty=1;draw();$("pm").classList.add("on")};window.closeP=()=>$("pm").classList.remove("on");
window.selS=x=>{sz=x;draw()};window.selC=x=>{co=x;draw()};window.q=d=>{qty=Math.max(1,qty+d);draw()};
function draw(){let p=P[did],S=String(p.size||"").split(",").map(x=>x.trim()).filter(Boolean),C=String(p.color||"").split(",").map(x=>x.trim()).filter(Boolean),text=`I want to order ${p.name}${sz?" | Size: "+sz:""}${co?" | Color: "+co:""} | Qty: ${qty}`;$("detail").innerHTML=`<div class="detail"><div><img class="main" src="${ims(p)[0]||""}"></div><div><h2>${e(p.name)}</h2><p>${e(p.description||"")}</p><h2>৳${pr(p).toLocaleString()} ${+p.discount?`<span class="old">৳${+p.price}</span>`:""}</h2>${+p.discount?`<b>${p.discount}% OFF</b>`:""}${S.length?`<p><b>Size</b></p><div class="actions">${S.map(x=>`<button class="btn ${x==sz?"selected":""}" onclick="selS(${JSON.stringify(x)})">${e(x)}</button>`).join("")}</div>`:""}${C.length?`<p><b>Color</b></p><div class="actions">${C.map(x=>`<button class="btn ${x==co?"selected":""}" onclick="selC(${JSON.stringify(x)})">${e(x)}</button>`).join("")}</div>`:""}<p>Qty: <button class="btn" onclick="q(-1)">−</button> ${qty} <button class="btn" onclick="q(1)">+</button></p><button class="btn" onclick="add()">Add to Cart</button> <button class="btn" onclick="buy()">Buy Now</button> <a class="btn" href="https://wa.me/${W}?text=${encodeURIComponent(text)}" target="_blank">WhatsApp Order</a></div></div>`}
window.add=()=>{let p=P[did],S=String(p.size||"").split(",").filter(Boolean),C=String(p.color||"").split(",").filter(Boolean);if(S.length&&!sz)return alert("Select size.");if(C.length&&!co)return alert("Select color.");CART.push({id:did,qty,size:sz,color:co});localStorage.fnfy=JSON.stringify(CART);cartRender();closeP();alert("Added to cart")};window.buy=()=>{add();setTimeout(openO,50)};window.openO=()=>{$("om").classList.add("on")};window.closeO=()=>$("om").classList.remove("on");
let CART=JSON.parse(localStorage.fnfy||"[]");function cartRender(){$("cc").textContent=CART.reduce((n,x)=>n+x.qty,0);if(!CART.length)return $("cartBox").textContent="Empty";$("cartBox").innerHTML=CART.map((x,i)=>`${e(P[x.id].name)} — Qty ${x.qty} ${x.size?"— Size "+e(x.size):""} ${x.color?"— Color "+e(x.color):""} — ৳${(pr(P[x.id])*x.qty).toLocaleString()} <button class="btn" onclick="rm(${i})">Remove</button>`).join("")+`<hr><button class="btn" onclick="openO()">Order on Website</button> <a class="btn" target="_blank" href="https://wa.me/${W}?text=FNFY%20Order%20Request">WhatsApp Order</a>`}window.rm=i=>{CART.splice(i,1);localStorage.fnfy=JSON.stringify(CART);cartRender()};
$("of").onsubmit=async x=>{x.preventDefault();let id="FNFY-"+Date.now().toString(36).toUpperCase(),items=CART.map(z=>({productId:z.id,name:P[z.id].name,qty:z.qty,size:z.size||"",color:z.color||"",price:pr(P[z.id])})),total=items.reduce((n,z)=>n+z.price*z.qty,0),o={orderId:id,name:$("on").value,phone:$("op").value,address:$("oa").value,items,total,status:"Pending",createdAt:Date.now()};await set(ref(db,"orders/"+id),o);await set(ref(db,"tracking/"+id),{orderId:id,status:"Pending",name:o.name,total,updatedAt:Date.now()});CART=[];localStorage.fnfy="[]";cartRender();closeO();alert("Order ID: "+id)};
window.track=()=>onValue(ref(db,"tracking/"+$("tid").value.trim()),s=>{$("tr").innerHTML=s.exists()?`<div class="box">Order ID: ${e(s.val().orderId)}<br>Status: <b>${e(s.val().status)}</b><br>Total: ৳${+s.val().total}</div>`:"Order ID not found."},{onlyOnce:true});
$("rf").onsubmit=async x=>{x.preventDefault();let id="REV-"+Date.now().toString(36).toUpperCase();await set(ref(db,"reviews/"+id),{name:$("rn").value,rating:+$("rr").value,text:$("rt").value,createdAt:Date.now()});x.target.reset();alert("Review submitted")};
onValue(ref(db,"products"),s=>{P=s.val()||{};cats();render();let p=Object.values(P)[0];if(p){$("hero").src=ims(p)[0]||"";$("heroText").textContent=p.name}});onValue(ref(db,"reviews"),s=>{$("reviews").innerHTML=Object.values(s.val()||{}).map(r=>`<div class="review"><b>${e(r.name)}</b> ${"⭐".repeat(+r.rating)}<p>${e(r.text)}</p></div>`).join("")||"No reviews yet."});cartRender();
</script></body></html>
