<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FNFY Men's Clothing</title><link rel="icon" href="fnfy-logo.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f6f6;color:#111}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd}.nav,.wrap,.hero{max-width:1200px;margin:auto}.nav{height:70px;display:flex;align-items:center;gap:10px;padding:8px 15px}.logo{height:52px;max-width:170px;object-fit:contain}.nav .btn{background:#000;color:#fff;border-color:#000}.sp{flex:1}.btn,.cat{border:1px solid #ddd;background:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:#111;color:#fff;border:0}.hero{padding:12px}.slides{position:relative;overflow:hidden;border-radius:22px;background:#111}.slide{display:none;position:relative}.slide.active{display:block}.slide img{width:100%;height:430px;object-fit:cover;opacity:.78}.overlay{position:absolute;inset:0;display:flex;align-items:end;padding:35px;color:white;background:linear-gradient(transparent,rgba(0,0,0,.8))}.overlay h1{font-size:clamp(30px,5vw,60px);margin:0 0 8px}.arrow{position:absolute;top:50%;border:0;border-radius:50%;width:42px;height:42px;cursor:pointer}.prev{left:12px}.next{right:12px}.dots{position:absolute;bottom:12px;left:50%;display:flex;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#aaa}.dot.on{background:#fff}.wrap{padding:20px 15px}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px}.cats{display:flex;gap:7px;overflow:auto}.cat.on{background:#111;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}.pic{aspect-ratio:1/1.1;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:9px;left:9px;background:#111;color:#fff;padding:6px 9px;border-radius:20px;font-size:12px}.info{padding:12px}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:5px}.actions{display:flex;gap:6px;margin-top:9px}.actions .btn{flex:1}.track,.review{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.row{display:flex;gap:8px}.input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.status{display:inline-block;background:#111;color:#fff;padding:8px 12px;border-radius:20px;margin-top:10px}footer{background:#111;color:#fff;margin-top:35px}.foot{max-width:1200px;margin:auto;padding:35px 15px;display:grid;grid-template-columns:2fr 1fr 1fr;gap:25px}.footlogo{background:#fff;border-radius:10px;height:60px;max-width:170px}.social a{display:inline-flex;width:42px;height:42px;border:1px solid #555;border-radius:50%;align-items:center;justify-content:center;margin-right:7px;color:#fff}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:30;padding:15px}.modal.on{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:34px;height:34px}.gallery{display:flex;gap:6px;overflow:auto}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:2px solid transparent}.thumb.on{border-color:#111}.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mainimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px}.empty{text-align:center;padding:30px;color:#777}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.slide img{height:350px}.foot{grid-template-columns:1fr 1fr}}@media(max-width:550px){.nav{height:62px}.logo{height:44px}.nav .txt{display:none}.detail{grid-template-columns:1fr}.row{flex-direction:column}.foot{grid-template-columns:1fr}}
</style></head><body>
<header><div class="nav"><a href="#"><img class="logo" src="fnfy-logo.png"></a><span class="sp"></span><button class="btn" onclick="shop()">Shop</button><a class="btn" href="https://wa.me/8801965460567" target="_blank">💬 <span class="txt">WhatsApp</span></a><a class="btn" href="https://www.facebook.com/share/19RWoj5v3K/" target="_blank">f <span class="txt">Facebook</span></a><a class="btn" href="https://www.instagram.com/fnfy2026/" target="_blank">◎ <span class="txt">Instagram</span></a><button class="btn" onclick="cartOpen()">🛒 <b id="count">0</b></button></div></header>
<section class="hero"><div class="slides" id="slides"></div></section>
<div class="wrap" id="shop">
<div class="head"><h2>Shop Collection</h2><button class="cat" onclick="moreCats()">••• Categories</button></div><div class="cats" id="cats"></div>
<div class="head"><h2>New Arrivals</h2></div><div class="grid" id="products"></div>
<div class="head"><h2>Offers & Discounts</h2></div><div class="grid" id="discounts"></div>
<div class="head" id="tracking"><h2>Track Your Order</h2></div><div class="track"><div class="row"><input class="input" id="trackId" placeholder="FNFY-XXXXXXXX"><button class="btn primary" onclick="track()">Track Order</button></div><div id="trackResult"></div></div>
<div class="head"><h2>Customer Reviews</h2></div>
<div class="review"><form id="reviewForm">
<div class="row"><input class="input" id="reviewName" required placeholder="Your name">
<select class="input" id="reviewRating" required><option value="">Rating</option><option value="5">★★★★★ 5</option><option value="4">★★★★ 4</option><option value="3">★★★ 3</option><option value="2">★★ 2</option><option value="1">★ 1</option></select></div><br>
<textarea class="input" id="reviewText" required placeholder="Write your review"></textarea><br><br>
<button class="btn primary">Submit Review</button>
</form></div><br><div id="reviews"></div>
</div>
<footer><div class="foot"><div><img class="footlogo" src="fnfy-logo.png"><p>FNFY Men's Clothing</p></div><div><h3>Contact</h3><p>WhatsApp: 01965460567</p></div><div><h3>Follow & Order</h3><div class="social"><a href="https://wa.me/8801965460567" target="_blank">WA</a><a href="https://www.facebook.com/share/19RWoj5v3K/" target="_blank">f</a><a href="https://www.instagram.com/fnfy2026/" target="_blank">◎</a></div></div></div></footer>
<div class="modal" id="productModal"><div class="box"><button class="close" onclick="closeM('productModal')">×</button><div id="detail"></div></div></div>
<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeM('cartModal')">×</button><h2>Cart</h2><div id="cartList"></div><div id="cartTotal"></div><button class="btn primary" onclick="checkout()">Place Order</button></div></div>
<div class="modal" id="checkoutModal"><div class="box"><button class="close" onclick="closeM('checkoutModal')">×</button><h2>Order</h2><form id="orderForm"><input class="input" id="name" required placeholder="Name"><br><br><input class="input" id="phone" required placeholder="Phone"><br><br><textarea class="input" id="address" required placeholder="Address"></textarea><br><br><select id="delivery" class="input"><option value="60">Dhaka — ৳60</option><option value="120">Outside Dhaka — ৳120</option></select><br><br><button class="btn primary">Confirm Order</button></form><div id="done"></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,onValue,get,set}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import{firebaseConfig}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getDatabase(app);let products={},cat="All",cart=JSON.parse(localStorage.fnfyCart||"[]"),slide=0,timer;
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),imgs=p=>Array.isArray(p.images)?p.images:[],price=p=>Number(p.price||0)*(1-Number(p.discount||0)/100);
function save(){localStorage.fnfyCart=JSON.stringify(cart);$("count").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function shop(){$("shop").scrollIntoView({behavior:"smooth"})}window.shop=shop;
function categories(){let a=["All",...new Set(Object.values(products).map(p=>p.category).filter(Boolean))];$("cats").innerHTML=a.map(x=>`<button class="cat ${x===cat?"on":""}" onclick="setCat('${esc(x)}')">${esc(x)}</button>`).join("")}window.setCat=x=>{cat=x;categories();render()};
function card(id,p){let im=imgs(p)[0]||"",d=Number(p.discount||0);return`<div class="card"><div class="pic"><img src="${im}">${d?`<span class="badge">${d}% OFF</span>`:""}</div><div class="info"><b>${esc(p.name)}</b><div><strong>৳${price(p).toLocaleString()}</strong>${d?` <span class="old">৳${Number(p.price).toLocaleString()}</span>`:""}</div><div class="actions"><button class="btn" onclick="openProduct('${id}')">View</button><button class="btn primary" onclick="add('${id}')">Add</button></div></div></div>`}
function render(){let a=Object.entries(products).filter(([i,p])=>cat==="All"||p.category===cat);$("products").innerHTML=a.map(x=>card(...x)).join("")||'<div class="empty">No products.</div>';$("discounts").innerHTML=a.filter(x=>Number(x[1].discount)>0).map(x=>card(...x)).join("")||'<div class="empty">No discount products.</div>';renderSlides()}
function renderSlides(){let a=Object.entries(products).filter(x=>imgs(x[1])[0]).slice(0,6);$("slides").innerHTML=a.length?a.map(([id,p],i)=>`<div class="slide ${i?"":"active"}"><img src="${imgs(p)[0]}"><div class="overlay"><div><h1>${esc(p.name||"FNFY Collection")}</h1><p>${Number(p.discount||0)?p.discount+"% OFF":"FNFY Men's Clothing"}</p><button class="btn primary" onclick="openProduct('${id}')">Shop Now</button> <a class="btn primary" href="https://wa.me/8801965460567?text=${encodeURIComponent("I want to order "+p.name)}" target="_blank">WhatsApp Order</a></div></div></div>`).join("")+`<button class="arrow prev" onclick="slideBy(-1)">‹</button><button class="arrow next" onclick="slideBy(1)">›</button><div class="dots">${a.map((_,i)=>`<i class="dot ${i?"":"on"}"></i>`).join("")}</div>`:`<div class="slide active"><div class="overlay"><div><h1>FNFY Men's Clothing</h1><a class="btn primary" href="https://wa.me/8801965460567" target="_blank">WhatsApp Order</a></div></div></div>`;slide=0;clearInterval(timer);if(a.length>1)timer=setInterval(()=>slideBy(1),5000)}
window.slideBy=d=>{let a=document.querySelectorAll(".slide");if(!a.length)return;slide=(slide+d+a.length)%a.length;a.forEach((x,i)=>x.classList.toggle("active",i===slide));document.querySelectorAll(".dot").forEach((x,i)=>x.classList.toggle("on",i===slide))};
window.moreCats=()=>document.querySelector(".cats").scrollIntoView({behavior:"smooth"});
function openProduct(id){
  let p=products[id], im=imgs(p), sel=0, q=1;
  let sizes=String(p.size||"").split(",").map(x=>x.trim()).filter(Boolean);
  let colors=String(p.color||"").split(",").map(x=>x.trim()).filter(Boolean);
  let selectedSize="", selectedColor="";
  function draw(){
    $("detail").innerHTML=`<div class="detail"><div><img class="mainimg" src="${im[sel]||""}"><div class="gallery">${im.map((x,i)=>`<img class="thumb ${i===sel?"on":""}" src="${x}" onclick="detailImage(${i})">`).join("")}</div></div><div>
    <h2>${esc(p.name)}</h2><p>${esc(p.description||"")}</p><h2>৳${price(p).toLocaleString()} ${Number(p.discount)?`<span class="old">৳${Number(p.price).toLocaleString()}</span>`:""}</h2>
    ${Number(p.discount)?`<p><b>${p.discount}% OFF</b></p>`:""}
    ${sizes.length?`<p><b>Size</b></p><div class="actions">${sizes.map(x=>`<button type="button" class="btn ${x===selectedSize?"primary":""}" onclick="detailSize(${JSON.stringify(x)})">${esc(x)}</button>`).join("")}</div>`:""}
    ${colors.length?`<p><b>Color</b></p><div class="actions">${colors.map(x=>`<button type="button" class="btn ${x===selectedColor?"primary":""}" onclick="detailColor(${JSON.stringify(x)})">${esc(x)}</button>`).join("")}</div>`:""}
    <p><b>Quantity</b></p><div class="actions"><button type="button" class="btn" onclick="detailQty(-1)">−</button><b>${q}</b><button type="button" class="btn" onclick="detailQty(1)">+</button></div><br>
    <button type="button" class="btn primary" onclick="detailAdd()">Add to Cart</button>
    <a class="btn primary" href="https://wa.me/8801965460567?text=${encodeURIComponent("I want to order "+p.name+(selectedSize?" | Size: "+selectedSize:"")+(selectedColor?" | Color: "+selectedColor:"")+" | Qty: "+q)}" target="_blank">WhatsApp Order</a>
    </div></div>`;
  }
  window.detailImage=i=>{sel=i;draw()};
  window.detailSize=x=>{selectedSize=x;draw()};
  window.detailColor=x=>{selectedColor=x;draw()};
  window.detailQty=d=>{q=Math.max(1,q+d);draw()};
  window.detailAdd=()=>{if(sizes.length&&!selectedSize)return alert("Please select a size.");if(colors.length&&!selectedColor)return alert("Please select a color.");cart.push({id,qty:q,size:selectedSize,color:selectedColor});save();closeM("productModal");alert("Added to cart")};
  draw();$("productModal").classList.add("on");
}
window.openProduct=openProduct;window.add=id=>{cart.push({id,qty:1,size:"",color:""});save();alert("Added to cart")};function closeM(id){$(id).classList.remove("on")}window.closeM=closeM;
function cartOpen(){$("cartList").innerHTML=cart.map((x,i)=>{let p=products[x.id];return p?`<p><b>${esc(p.name)}</b> × ${x.qty} — ৳${(price(p)*x.qty).toLocaleString()} <button onclick="cart.splice(${i},1);save();cartOpen()">×</button></p>`:""}).join("")||'<div class="empty">Cart empty.</div>';$("cartTotal").innerHTML="<h3>Total: ৳"+cart.reduce((a,x)=>a+(products[x.id]?price(products[x.id])*x.qty:0),0).toLocaleString()+"</h3>";$("cartModal").classList.add("on")}window.cartOpen=cartOpen;
function checkout(){if(!cart.length)return alert("Cart empty");closeM("cartModal");$("checkoutModal").classList.add("on")}
$("orderForm").onsubmit=async e=>{e.preventDefault();let id="FNFY-"+Math.random().toString(36).slice(2,10).toUpperCase(),items=cart.map(x=>{let p=products[x.id];return{id:x.id,name:p.name,qty:x.qty,size:x.size,color:x.color,price:price(p),image:imgs(p)[0]||""}}),sub=items.reduce((a,x)=>a+x.price*x.qty,0),dc=Number($("delivery").value),o={id,name:$("name").value,phone:$("phone").value,address:$("address").value,items,subtotal:sub,deliveryCharge:dc,total:sub+dc,status:"Pending",createdAt:Date.now()};try{await set(ref(db,"orders/"+id),o);await set(ref(db,"tracking/"+id),{status:"Pending",name:o.name,total:o.total,createdAt:o.createdAt});$("done").innerHTML=`<h3>Order placed</h3><p>Order ID: <b>${id}</b></p><a class="btn primary" target="_blank" href="https://wa.me/8801965460567?text=${encodeURIComponent("FNFY Order "+id+" | "+o.name+" | "+o.total)}">WhatsApp Order</a>`;cart=[];save();$("orderForm").reset()}catch(x){alert(x.message)}};
async function track(){let id=$("trackId").value.trim().toUpperCase();if(!id)return;let s=await get(ref(db,"tracking/"+id));$("trackResult").innerHTML=s.exists()?`<span class="status">${esc(s.val().status)}</span><p>Order ID: <b>${esc(id)}</b><br>Customer: ${esc(s.val().name||"")}<br>Total: ৳${Number(s.val().total||0).toLocaleString()}</p>`:"<p>Order ID not found.</p>"}window.track=track;
onValue(ref(db,"products"),s=>{products=s.val()||{};categories();render()});$("reviewForm").onsubmit=async e=>{e.preventDefault();try{let id="REV-"+Math.random().toString(36).slice(2,10).toUpperCase();await set(ref(db,"reviews/"+id),{name:$("reviewName").value.trim(),rating:Number($("reviewRating").value),text:$("reviewText").value.trim(),createdAt:Date.now()});$("reviewForm").reset();alert("Review submitted");}catch(e){alert("Review submit failed: "+e.message)}};onValue(ref(db,"reviews"),s=>{$("reviews").innerHTML=Object.values(s.val()||{}).map(r=>`<div class="review"><b>${esc(r.name)}</b><p>${esc(r.text)}</p></div>`).join("")||'<div class="empty">No reviews yet.</div>'});save();
</script></body></html>
